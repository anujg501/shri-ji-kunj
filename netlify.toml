# Netlify deployment. The app lives in app/; Netlify installs, builds and
# publishes app/dist. Routes use "#" addresses, so no redirect rules are needed.

[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Built files change name when they change, so only HTML must stay uncached,
# or family phones keep showing an old version after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
